[project]
name = "setuhaul"
version = "0.1.0"
description = "SetuHaul dock agent - Level 1 learning build"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.12",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.4",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
infra = [
    "aws-cdk-lib>=2.278.0",
    "constructs>=10.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
