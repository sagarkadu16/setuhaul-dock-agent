[project]
name = "setuhaul"
version = "0.1.0"
description = "SetuHaul dock agent - Level 1 learning build"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
