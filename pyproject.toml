[project]
name = "setuhaul-dock-agent"
version = "0.1.0"
description = "Driver chat agent that reschedules dock slots (SetuHaul FDE challenge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.165.0",
    "uvicorn~=0.54.0",
    "langgraph~=1.2.24",
    "langgraph-checkpoint-sqlite~=3.1.3",
    "langchain-core~=1.8.4",
    "langchain-openai~=1.8.5",
    "python-dotenv~=1.2.4",
    "itsdangerous~=2.2.0",
    "email-validator~=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "httpx~=0.28.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Third-party, not ours: langsmith uses asyncio.iscoroutinefunction (deprecated in 3.14).
    "ignore::DeprecationWarning:langsmith.*",
]
