# Server version of the stack (the laptop uses ../compose.yaml).
# Differences: data on the EBS disk (/srv/setuhaul/data), .env written by server-deploy.sh.
name: setuhaul

services:
  api:
    image: ${SETUHAUL_IMAGE:?set SETUHAUL_IMAGE to the ECR image:tag}
    env_file: .env
    environment:
      APP_DB_PATH: /data/app.db
      CHECKPOINT_DB_PATH: /data/checkpoints.db
    volumes:
      - /srv/setuhaul/data:/data
    restart: unless-stopped
    # No "ports": only the UI reaches the API, over the compose network.

  ui:
    image: ${SETUHAUL_IMAGE:?set SETUHAUL_IMAGE to the ECR image:tag}
    command: ["streamlit", "run", "ui/app.py",
              "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      SETUHAUL_API_URL: http://api:8000
    ports:
      - "8501:8501"                 # the security group admits CloudFront only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
